
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12TH CENTRAL FIELD CONVENTION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Create 12TH CENTRAL FIELD CONVENTION</h1>
    <p>Add your name and photograph below.</p>

    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="photo">Upload Your Photograph</label>
    <input type="file" id="photo" accept="image/*">

    <div class="preview">
      <canvas id="flyerCanvas"></canvas>
    </div>

    <button id="downloadBtn">Download My Flyer</button>
  </div>

  <script src="script.js"></script>
</body>
      </html>
